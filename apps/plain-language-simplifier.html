<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plain Language Simplifier</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream:   #f5f0e8;
  --cream2:  #ede8de;
  --cream3:  #e2dbd0;
  --ink:     #1c1917;
  --ink2:    #3d3832;
  --muted:   #8c8680;
  --hint:    #b8b3ac;
  --border:  #d8d2c8;
  --border2: #c8c2b8;
  --white:   #fdfaf5;
  --green:   #2d6a4f;
  --green-bg:#e8f5ee;
  --amber:   #92400e;
  --amber-bg:#fef3c7;
  --red:     #9b1c1c;
  --red-bg:  #fee2e2;
  --accent:  #5c3d1e;
  --serif:   'Lora', Georgia, serif;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'DM Sans', sans-serif;
}

body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  padding: 0 28px;
  height: 58px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  gap: 14px;
}

.logo-text {
  font-family: var(--serif);
  font-size: 17px;
  font-style: italic;
  color: var(--ink);
  letter-spacing: -.01em;
}

.logo-text strong { font-style: normal; font-weight: 500; }

.hdr-sep { width: 1px; height: 16px; background: var(--border); }

.hdr-sub {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}

header .spc { flex: 1; }

.hdr-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--hint);
  background: var(--cream2);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 20px;
}

/* ── Main layout ── */
.shell {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr;
  min-height: calc(100vh - 58px);
}

/* ── Control bar ── */
.controls {
  grid-column: 1 / -1;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.ctrl-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}

/* Audience pills */
.audience-pills {
  display: flex;
  gap: 4px;
}

.pill {
  padding: 6px 14px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  transition: all .15s;
}

.pill:hover { border-color: var(--border2); color: var(--ink2); }

.pill.active {
  background: var(--ink);
  color: var(--cream);
  border-color: var(--ink);
  font-weight: 500;
}

.ctrl-sep { width: 1px; height: 20px; background: var(--border); }

/* Preserve toggle */
.preserve-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.preserve-wrap input { display: none; }

.toggle-track {
  width: 32px; height: 18px;
  background: var(--cream3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  position: relative;
  transition: background .2s;
}

.toggle-thumb {
  position: absolute;
  top: 2px; left: 2px;
  width: 12px; height: 12px;
  background: var(--white);
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: left .2s;
}

input:checked + .toggle-track { background: var(--ink); border-color: var(--ink); }
input:checked + .toggle-track .toggle-thumb { left: 16px; }

.preserve-label {
  font-size: 12px;
  color: var(--ink2);
}

.controls .spc { flex: 1; }

/* Generate btn */
#gen-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  flex-shrink: 0;
}

#gen-btn:hover { opacity: .85; }
#gen-btn:active { transform: scale(.98); }
#gen-btn:disabled { opacity: .4; cursor: not-allowed; }

.spinner {
  width: 13px; height: 13px;
  border: 1.5px solid rgba(245,240,232,.3);
  border-top-color: var(--cream);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Panels ── */
.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-left  { border-right: 1px solid var(--border); background: var(--white); }
.panel-right { background: var(--cream); }

.panel-head {
  padding: 14px 24px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}

.panel-title {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Score card */
.score-card {
  display: flex;
  align-items: center;
  gap: 8px;
}

.score-num {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
  transition: color .4s;
}

.score-bar-wrap {
  width: 72px; height: 5px;
  background: var(--cream3);
  border-radius: 3px;
  overflow: hidden;
}

.score-bar {
  height: 100%;
  border-radius: 3px;
  width: 0%;
  transition: width .8s cubic-bezier(.4,0,.2,1), background .4s;
}

.score-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .04em;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 500;
}

.lbl-hard   { background: var(--red-bg);   color: var(--red);   }
.lbl-medium { background: var(--amber-bg); color: var(--amber); }
.lbl-easy   { background: var(--green-bg); color: var(--green); }

/* Text areas */
.panel-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px 24px;
  gap: 12px;
  overflow-y: auto;
}

textarea {
  flex: 1;
  width: 100%;
  min-height: 260px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.75;
  border-radius: 8px;
  padding: 16px 18px;
  resize: none;
  outline: none;
  transition: border-color .15s;
}

textarea:focus { border-color: var(--border2); }
textarea::placeholder { color: var(--hint); font-style: italic; }

/* Meta row */
.meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}

.word-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--hint);
}

/* Sample buttons */
.samples-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.sample-btn {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  cursor: pointer;
  transition: all .15s;
}

.sample-btn:hover { border-color: var(--border2); color: var(--ink2); }

/* Error */
.err-msg {
  background: var(--red-bg);
  border: 1px solid #fca5a5;
  color: var(--red);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  display: none;
}

/* ── Output panel ── */
.output-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  padding: 40px;
}

.placeholder-rule { width: 32px; height: 1px; background: var(--border2); }

.placeholder-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--hint);
}

.placeholder-text {
  font-family: var(--serif);
  font-style: italic;
  color: var(--muted);
  font-size: 14px;
  max-width: 220px;
  line-height: 1.65;
}

/* Simplified text area */
.simplified-text {
  flex: 1;
  width: 100%;
  min-height: 260px;
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.75;
  border-radius: 8px;
  padding: 16px 18px;
  resize: none;
  outline: none;
}

/* Stats row */
.stats-row {
  display: flex;
  gap: 10px;
}

.stat-card {
  flex: 1;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  text-align: center;
}

.stat-val {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
  display: block;
  margin-bottom: 2px;
}

.stat-val.positive { color: var(--green); }
.stat-val.negative { color: var(--red); }

.stat-lbl {
  font-size: 11px;
  color: var(--muted);
}

/* What changed panel */
.changes-panel {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.changes-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}

.changes-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.changes-count {
  background: var(--cream2);
  border: 1px solid var(--border);
  color: var(--ink2);
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 20px;
}

.changes-chevron {
  font-size: 10px;
  color: var(--hint);
  transition: transform .2s;
}

.changes-body { display: none; }
.changes-body.open { display: block; }

.change-item {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}

.change-item:last-child { border-bottom: none; }

.change-orig {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--red);
  background: var(--red-bg);
  padding: 2px 7px;
  border-radius: 3px;
  text-decoration: line-through;
  flex-shrink: 0;
  max-width: 120px;
  word-break: break-word;
}

.change-arrow { color: var(--hint); font-size: 11px; padding-top: 2px; flex-shrink: 0; }

.change-new {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--green);
  background: var(--green-bg);
  padding: 2px 7px;
  border-radius: 3px;
  flex-shrink: 0;
  max-width: 120px;
  word-break: break-word;
}

.change-reason {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  flex: 1;
  padding-top: 2px;
}

/* Summary banner */
.summary-banner {
  background: var(--cream2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.6;
}

/* Export buttons */
.export-row {
  display: flex;
  gap: 8px;
}

.exp-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--sans);
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}

.exp-btn:hover { color: var(--ink); border-color: var(--border2); background: var(--cream); }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.anim { animation: fadeUp .3s ease both; }
.anim-d1 { animation-delay: .05s; }
.anim-d2 { animation-delay: .1s; }
.anim-d3 { animation-delay: .15s; }
.anim-d4 { animation-delay: .2s; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo-text"><strong>Plain</strong>Language <em>Simplifier</em></div>
  <div class="hdr-sep"></div>
  <div class="hdr-sub">Technical Writer Portfolio</div>
  <div class="spc"></div>
  <div class="hdr-tag">claude-sonnet-4-20250514</div>
</header>

<div class="shell">

  <!-- Controls -->
  <div class="controls">
    <span class="ctrl-label">Audience</span>
    <div class="audience-pills">
      <button class="pill active" data-audience="general" onclick="setAudience(this)">General public</button>
      <button class="pill" data-audience="business" onclick="setAudience(this)">Business</button>
      <button class="pill" data-audience="technical" onclick="setAudience(this)">Technical</button>
    </div>
    <div class="ctrl-sep"></div>
    <label class="preserve-wrap">
      <input type="checkbox" id="preserve-toggle" />
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span class="preserve-label">Preserve technical terms</span>
    </label>
    <div class="spc"></div>
    <button id="gen-btn" onclick="generate()">
      <div class="spinner" id="spinner"></div>
      <span id="gen-label">Simplify text</span>
    </button>
  </div>

  <!-- Left panel: input -->
  <div class="panel panel-left">
    <div class="panel-head">
      <span class="panel-title">Original text</span>
      <div class="score-card" id="score-before">
        <span class="score-num" id="score-before-num">—</span>
        <div class="score-bar-wrap"><div class="score-bar" id="bar-before"></div></div>
        <span class="score-label" id="lbl-before"></span>
      </div>
    </div>
    <div class="panel-body">
      <div class="samples-row">
        <button class="sample-btn" onclick="loadSample('legal')">Legal disclaimer</button>
        <button class="sample-btn" onclick="loadSample('error')">Error message</button>
        <button class="sample-btn" onclick="loadSample('policy')">Gov. policy</button>
      </div>
      <textarea id="input-text" placeholder="Paste your complex, jargon-heavy, or passive text here…

The app will simplify it for your chosen audience and show you exactly what changed and why." oninput="updateWordCount()"></textarea>
      <div class="meta-row">
        <span class="word-count" id="wc-before">0 words</span>
        <div id="err-msg" class="err-msg"></div>
      </div>
    </div>
  </div>

  <!-- Right panel: output -->
  <div class="panel panel-right">
    <div class="panel-head">
      <span class="panel-title">Simplified text</span>
      <div class="score-card" id="score-after-card" style="opacity:0;transition:opacity .4s;">
        <span class="score-num" id="score-after-num">—</span>
        <div class="score-bar-wrap"><div class="score-bar" id="bar-after"></div></div>
        <span class="score-label" id="lbl-after"></span>
      </div>
    </div>
    <div class="panel-body" id="output-body">

      <div class="output-placeholder" id="placeholder">
        <div class="placeholder-rule"></div>
        <div class="placeholder-label">Awaiting input</div>
        <p class="placeholder-text">Paste your text on the left and click Simplify to see the result here.</p>
      </div>

    </div>
  </div>

</div>

<script>
let audience = 'general';

const SAMPLES = {
  legal: `Notwithstanding any provision to the contrary contained herein, the indemnifying party shall defend, indemnify, and hold harmless the indemnified party from and against any and all claims, damages, losses, costs, and expenses, including reasonable attorneys' fees, arising out of or relating to any breach or alleged breach of any representation, warranty, covenant, or obligation of the indemnifying party set forth in this Agreement.`,

  error: `An unhandled exception was encountered during the execution of the current web request. Please review the stack trace for more information about the error and where it originated in the code. The exception was thrown by the runtime component and could not be intercepted by the application-level exception handler due to an internal serialization failure in the middleware pipeline.`,

  policy: `In accordance with the provisions set forth under Section 12(b) of the Administrative Procedures Act, all regulated entities subject to the jurisdiction of this Commission shall be required to submit, within thirty (30) calendar days of the effective date of this regulation, a comprehensive compliance attestation form duly executed by an authorised officer of the regulated entity, certifying that all requisite internal controls and procedural safeguards have been implemented in conformity with the standards prescribed herein.`
};

function loadSample(key) {
  document.getElementById('input-text').value = SAMPLES[key];
  updateWordCount();
  hideErr();
  computeAndShowBeforeScore();
}

function setAudience(btn) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  audience = btn.dataset.audience;
}

function wordCount(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}

function updateWordCount() {
  const t = document.getElementById('input-text').value;
  document.getElementById('wc-before').textContent = wordCount(t) + ' words';
  computeAndShowBeforeScore();
}

/* ── Flesch Reading Ease ── */
function countSyllables(word) {
  word = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!word.length) return 0;
  let count = 0;
  const vowels = 'aeiouy';
  let prev = false;
  for (const ch of word) {
    const isVowel = vowels.includes(ch);
    if (isVowel && !prev) count++;
    prev = isVowel;
  }
  if (word.endsWith('e') && count > 1) count--;
  return Math.max(count, 1);
}

function flesch(text) {
  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 2);
  const words = text.trim().split(/\s+/).filter(Boolean);
  if (!sentences.length || !words.length) return 0;
  const syllables = words.reduce((n, w) => n + countSyllables(w), 0);
  const score = 206.835
    - 1.015 * (words.length / sentences.length)
    - 84.6  * (syllables / words.length);
  return Math.min(100, Math.max(0, Math.round(score)));
}

function avgSentenceLen(text) {
  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 2);
  const words = text.trim().split(/\s+/).filter(Boolean);
  if (!sentences.length) return 0;
  return Math.round(words.length / sentences.length);
}

function scoreLabel(score) {
  if (score >= 60) return { text: 'Easy', cls: 'lbl-easy', barColor: '#2d6a4f' };
  if (score >= 30) return { text: 'Medium', cls: 'lbl-medium', barColor: '#d97706' };
  return { text: 'Hard', cls: 'lbl-hard', barColor: '#9b1c1c' };
}

function renderScore(numId, barId, lblId, score, animate) {
  const info = scoreLabel(score);
  const numEl = document.getElementById(numId);
  const barEl = document.getElementById(barId);
  const lblEl = document.getElementById(lblId);
  numEl.textContent = score;
  lblEl.textContent = info.text;
  lblEl.className = 'score-label ' + info.cls;
  if (animate) {
    setTimeout(() => {
      barEl.style.width = score + '%';
      barEl.style.background = info.barColor;
    }, 100);
  } else {
    barEl.style.width = score + '%';
    barEl.style.background = info.barColor;
  }
}

function computeAndShowBeforeScore() {
  const t = document.getElementById('input-text').value.trim();
  if (!t) return;
  const s = flesch(t);
  renderScore('score-before-num', 'bar-before', 'lbl-before', s, false);
}

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideErr() { document.getElementById('err-msg').style.display = 'none'; }

function setLoading(on) {
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('gen-label').textContent = on ? 'Simplifying…' : 'Simplify text';
  document.getElementById('gen-btn').disabled = on;
}

/* ── Main generate ── */
async function generate() {
  hideErr();
  const text = document.getElementById('input-text').value.trim();
  if (!text) { showErr('Please paste some text first.'); return; }

  const preserve = document.getElementById('preserve-toggle').checked;

  const audienceMap = {
    general:   'a general public audience (Grade 6–8 reading level). Use everyday words. Short sentences. Avoid all jargon.',
    business:  'a business professional audience (Grade 10–12 reading level). Keep business terms but cut bureaucratic language and passive voice.',
    technical: 'a technical professional audience (Grade 12+ reading level). Keep technical accuracy but cut unnecessary complexity, passive voice, and verbose phrasing.'
  };

  const preserveInstruction = preserve
    ? 'Preserve domain-specific technical terms (e.g. API, OAuth, GDPR, SLA, indemnify) — but simplify everything around them.'
    : 'Replace jargon and technical terms with plain everyday equivalents wherever possible.';

  const systemPrompt = `You are an expert plain language editor. Your job is to rewrite complex, jargon-heavy, or passive text into clear, direct, plain language.

Target audience: ${audienceMap[audience]}

${preserveInstruction}

Rules:
- Use active voice
- Shorten sentences (aim for under 20 words each)
- Start with the main point
- Cut redundant words and phrases
- Replace nominalisations with verbs (e.g. "make a decision" → "decide")

Return ONLY valid JSON — no markdown, no explanation. Use this exact schema:
{
  "simplified_text": "the rewritten text",
  "summary": "one sentence describing the main improvements made",
  "changes": [
    { "original": "original word or phrase", "replacement": "new word or phrase", "reason": "plain English reason why (max 10 words)" }
  ]
}

Include 4–8 of the most significant changes in the changes array.`;

  setLoading(true);

  try {
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: text }]
      })
    });

    const data = await res.json();
    const raw = data.content?.[0]?.text || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const doc = JSON.parse(clean);
    renderOutput(doc, text);
  } catch(e) {
    showErr('Could not simplify. Try again or check your input.');
    console.error(e);
  } finally {
    setLoading(false);
  }
}

function renderOutput(doc, originalText) {
  const simplifiedText = doc.simplified_text || '';
  const changes = doc.changes || [];
  const summary = doc.summary || '';

  // Scores
  const scoreBefore = flesch(originalText);
  const scoreAfter  = flesch(simplifiedText);
  renderScore('score-before-num', 'bar-before', 'lbl-before', scoreBefore, false);
  renderScore('score-after-num',  'bar-after',  'lbl-after',  scoreAfter,  true);
  document.getElementById('score-after-card').style.opacity = '1';

  // Stats
  const wcBefore = wordCount(originalText);
  const wcAfter  = wordCount(simplifiedText);
  const wcDiff   = wcAfter - wcBefore;
  const aslBefore = avgSentenceLen(originalText);
  const aslAfter  = avgSentenceLen(simplifiedText);
  const scoreDiff = scoreAfter - scoreBefore;

  // Changes HTML
  const changesHtml = changes.map(c => `
    <div class="change-item">
      <span class="change-orig">${esc(c.original)}</span>
      <span class="change-arrow">→</span>
      <span class="change-new">${esc(c.replacement)}</span>
      <span class="change-reason">${esc(c.reason)}</span>
    </div>`).join('');

  const body = document.getElementById('output-body');
  body.innerHTML = `
    ${summary ? `<div class="summary-banner anim">"${esc(summary)}"</div>` : ''}

    <textarea class="simplified-text anim anim-d1" id="simplified-out" spellcheck="true">${esc(simplifiedText)}</textarea>

    <div class="export-row anim anim-d2">
      <button class="exp-btn" onclick="copySimplified()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 9H2a1 1 0 01-1-1V2a1 1 0 011-1h6a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Copy text
      </button>
      <button class="exp-btn" onclick="copyMarkdown()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 3h11M1 6.5h7M1 10h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Copy as Markdown
      </button>
      <span style="flex:1;"></span>
      <span style="font-family:var(--mono);font-size:11px;color:var(--hint);align-self:center;">click to edit</span>
    </div>

    <div class="stats-row anim anim-d3">
      <div class="stat-card">
        <span class="stat-val ${scoreDiff >= 0 ? 'positive' : 'negative'}">${scoreDiff >= 0 ? '+' : ''}${scoreDiff}</span>
        <span class="stat-lbl">Reading ease</span>
      </div>
      <div class="stat-card">
        <span class="stat-val ${wcDiff <= 0 ? 'positive' : 'negative'}">${wcDiff >= 0 ? '+' : ''}${wcDiff}</span>
        <span class="stat-lbl">Word count</span>
      </div>
      <div class="stat-card">
        <span class="stat-val ${aslAfter <= aslBefore ? 'positive' : 'negative'}">${aslAfter} words</span>
        <span class="stat-lbl">Avg sentence</span>
      </div>
      <div class="stat-card">
        <span class="stat-val">${changes.length}</span>
        <span class="stat-lbl">Changes made</span>
      </div>
    </div>

    ${changes.length ? `
    <div class="changes-panel anim anim-d4">
      <div class="changes-header" onclick="toggleChanges(this)">
        <div class="changes-title">
          What changed
          <span class="changes-count">${changes.length}</span>
        </div>
        <span class="changes-chevron">▼</span>
      </div>
      <div class="changes-body open">
        ${changesHtml}
      </div>
    </div>` : ''}
  `;
}

function toggleChanges(header) {
  const body = header.nextElementSibling;
  const ch = header.querySelector('.changes-chevron');
  const open = body.classList.toggle('open');
  ch.style.transform = open ? '' : 'rotate(-90deg)';
}

function copySimplified() {
  const el = document.getElementById('simplified-out');
  if (!el) return;
  navigator.clipboard.writeText(el.value);
  flashBtn(event.currentTarget, 'Copied!');
}

function copyMarkdown() {
  const el = document.getElementById('simplified-out');
  if (!el) return;
  const md = el.value.split('\n').map(l => l.trim()).filter(Boolean).join('\n\n');
  navigator.clipboard.writeText(md);
  flashBtn(event.currentTarget, 'Copied!');
}

function flashBtn(btn, msg) {
  const orig = btn.textContent.trim();
  btn.textContent = msg;
  setTimeout(() => btn.textContent = orig, 1500);
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// Init word count
updateWordCount();
</script>
</body>
</html>
